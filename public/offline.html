<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0135df" />
<title>You're offline — ANONYMA</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0135df;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  main { max-width: 360px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.6; color: #d9e3ff; margin: 0 0 24px; }
  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #0135df;
    background: #fff;
    border: 0;
    border-radius: 2px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button:hover { background: #eef2ff; }
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>ANONYMA needs a connection to reach your models and account. Reconnect, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
